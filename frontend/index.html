<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Escala CICC</title>
<script>
  (() => {
    let theme;
    try { theme = localStorage.getItem('escala-theme'); } catch {}
    document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
      ? theme : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  })();
</script></head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
